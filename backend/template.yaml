AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Prompt CV - Standalone Stack

Parameters:
  GoogleClientId:
    Type: String
    Description: Google OAuth2 Client ID
    Default: ""
  GoogleClientSecret:
    Type: String
    Description: Google OAuth2 Client Secret
    Default: ""
    NoEcho: true
  GoogleRefreshToken:
    Type: String
    Description: Google OAuth2 Refresh Token
    Default: ""
    NoEcho: true
Globals:
  Function:
    Timeout: 60
    Runtime: nodejs20.x
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps

Resources:
  CvApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - Accept
          - Mcp-Session-Id
          - Mcp-Protocol-Version

  CvApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cv-api.handler
      CodeUri: src/handlers/
      Environment:
        Variables:
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REFRESH_TOKEN: !Ref GoogleRefreshToken
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - cv-api.ts
        External:
          - '@aws-sdk/*'

  CvIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CvApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CvApiFunction.Arn
      PayloadFormatVersion: "2.0"

  CvPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CvApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CvApi}/*"

  CvRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CvApi
      RouteKey: "GET /cv"
      Target: !Sub "integrations/${CvIntegration}"

  CvGenerateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CvApi
      RouteKey: "POST /cv/generate"
      Target: !Sub "integrations/${CvIntegration}"

  CvOptimizeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CvApi
      RouteKey: "POST /cv/optimize"
      Target: !Sub "integrations/${CvIntegration}"

  DocsHtmlRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CvApi
      RouteKey: "PUT /docs/{id}/html"
      Target: !Sub "integrations/${CvIntegration}"

  # Frontend Hosting
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "prompt-cv-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "prompt-cv-frontend-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100
        HttpVersion: http2

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${CvApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendBucketName:
    Description: S3 bucket name for frontend
    Value: !Ref FrontendBucket
  FrontendUrl:
    Description: CloudFront distribution URL for frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"
